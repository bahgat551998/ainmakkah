plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ainmakkah.countdown'
    compileSdk 34

    defaultConfig {
        applicationId "com.ainmakkah.countdown"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    // توقيع ثابت: لو وُجد ملف المفتاح (من GitHub Secrets) نستخدمه، عشان التحديثات تنزل فوق بعض
    signingConfigs {
        shared {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists() && file(ksPath).length() > 0) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists() && file(ksPath).length() > 0) {
                signingConfig signingConfigs.shared
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // الملفات الخطية woff2 لا تُضغط حتى يقرأها WebView مباشرة
    androidResources {
        noCompress 'woff2'
    }
}
